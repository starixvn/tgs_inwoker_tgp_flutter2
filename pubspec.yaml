  http: ^0.12.2
  shared_preferences: ^2.0.5
  json_annotation: ^3.0.0
  provider: ^5.0.0
  auto_size_text: ^2.1.0
  fluttertoast: ^7.1.1
  marquee: ^1.6.1
  flutter_swiper: ^1.1.6
  outline_gradient_button: ^1.0.0+2
  gradient_text: ^1.0.2
  vs_scrollbar: ^0.2.0
  flutter_svg: ^0.19.3
  pull_to_refresh: ^1.6.4
  fdottedline: ^1.0.1
  flutter_inappwebview: ^4.0.0+4
  ndialog: ^4.0.1
  cached_network_image: ^2.0.0
  flutter_html: ^1.2.0
  lottie: ^0.1.4
