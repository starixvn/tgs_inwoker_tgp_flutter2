  package_info: ^2.0.2
  easy_gradient_text: ^1.0.0
  qr_flutter: ^4.0.0
  flutter_switch: ^0.3.2

  api:
    git: https://gitlab.com/yewtungcheong/api


  # The following adds the Cupertino Icons font to your application.
